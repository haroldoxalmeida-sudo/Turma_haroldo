<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turma Haroldo Concurso</title>
<meta name="theme-color" content="#14243F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body class="login">
<div class="wrap">

  <!-- LOGIN -->
  <section id="auth" class="auth">
    <img class="logo" src="icon-192.png" alt="">
    <div class="kicker">TURMA CARREIRAS POLICIAIS</div>
    <div class="brand">Haroldo Concurso</div>
    <div class="sub">Entre para acessar o seu material</div>
    <div class="tabs"><button id="tEntrar" class="on" type="button">Entrar</button><button id="tCriar" type="button">Criar conta</button></div>
    <form id="fAuth">
      <div id="campos-cad" class="hidden">
        <label>Nome completo</label><input id="nome" autocomplete="name">
        <label>WhatsApp</label><input id="whats" inputmode="tel" placeholder="(65) 99999-9999">
      </div>
      <label>E-mail</label><input id="email" type="email" autocomplete="email" required>
      <label>Senha</label><input id="senha" type="password" autocomplete="current-password" minlength="6" required>
      <button class="btn" id="bAuth" type="submit">Entrar</button>
      <div class="msg" id="mAuth"></div>
    </form>
    <button class="link" id="bEsqueci" type="button">Esqueci minha senha</button>
    <div class="foot">Dúvidas? WhatsApp (65) 99681-8656 · @haroldoconcurso</div>
  </section>

  <!-- APP -->
  <section id="app" class="hidden">
    <div class="top">
      <div class="toprow">
        <div><div class="hello" id="hello">Olá</div><div class="ttl" id="ttl">Suas trilhas</div></div>
        <div class="tbtns"><button class="out gold hidden" id="bPainel">Painel</button><button class="out" id="bSair">Sair</button></div>
      </div>
      <div class="prog hidden" id="prog"><small id="progTxt"></small><div class="bar"><div id="progBar" style="width:0"></div></div></div>
    </div>
    <div class="content" id="conteudo"><div class="spin">Carregando…</div></div>
    <nav class="nav hidden" id="nav">
      <button data-nav="inicio"><span>🏠</span>Início</button>
      <button data-nav="materiais"><span>📚</span>Materiais</button>
      <button data-nav="edital"><span>📋</span>Edital</button>
      <button data-nav="leis"><span>⚖️</span>Leis</button>
      <button data-nav="conta"><span>👤</span>Conta</button>
    </nav>
  </section>

</div>

<!-- LEITOR DE PDF -->
<div class="leitor hidden" id="leitor">
  <div class="lbar"><button class="out" id="lFechar">‹ Voltar</button><span id="lTitulo"></span><button class="out gold" id="lBaixar">Baixar</button></div>
  <div class="lpages" id="lPages"></div>
</div>

<!-- QUESTÕES E FLASHCARDS -->
<div class="jogo hidden" id="jogo">
  <div class="lbar"><button class="out" id="jFechar">‹ Sair</button><span id="jTitulo"></span></div>
  <div class="jcorpo" id="jCorpo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=12"></script>
</body>
</html>
